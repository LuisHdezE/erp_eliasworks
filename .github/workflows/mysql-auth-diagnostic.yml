name: EliasWorks MySQL 1045 Identity Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/mysql-auth-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Verify production MySQL identity safely
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Fetch production env and Laravel log read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" \
            ftp://ftp.eliasworks.uy/public_html/.env \
            --output /tmp/prod.env
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" \
            ftp://ftp.eliasworks.uy/public_html/storage/logs/laravel.log \
            --output /tmp/prod-laravel.log

      - name: Compare Dotenv interpretation and rejected identity
        run: |
          php <<'PHP'
          <?php
          require __DIR__ . '/vendor/autoload.php';

          function flag(string $name, bool $value): void {
              echo $name . '=' . ($value ? 'true' : 'false') . PHP_EOL;
          }

          function rawEnv(string $path): array {
              $values = [];
              foreach (file($path, FILE_IGNORE_NEW_LINES) ?: [] as $line) {
                  $trimmed = trim($line);
                  if ($trimmed === '' || str_starts_with($trimmed, '#') || !str_contains($line, '=')) {
                      continue;
                  }
                  [$key, $value] = explode('=', $line, 2);
                  $key = trim($key);
                  $value = trim($value);
                  if (strlen($value) >= 2 && (($value[0] === '"' && $value[-1] === '"') || ($value[0] === "'" && $value[-1] === "'"))) {
                      $value = substr($value, 1, -1);
                  }
                  $values[$key] = $value;
              }
              return $values;
          }

          $raw = rawEnv('/tmp/prod.env');
          $parsed = [];
          try {
              $parsed = Dotenv\Dotenv::createImmutable('/tmp', 'prod.env')->safeLoad();
              flag('DOTENV_PARSE_SUCCESS', true);
          } catch (Throwable $e) {
              flag('DOTENV_PARSE_SUCCESS', false);
          }

          foreach (['DB_HOST', 'DB_DATABASE', 'DB_USERNAME', 'DB_PASSWORD'] as $key) {
              flag('DOTENV_' . $key . '_MATCHES_RAW', isset($raw[$key], $parsed[$key]) && hash_equals((string)$raw[$key], (string)$parsed[$key]));
          }

          $userPrefix = isset($parsed['DB_USERNAME']) ? explode('_', (string)$parsed['DB_USERNAME'], 2)[0] : '';
          $dbPrefix = isset($parsed['DB_DATABASE']) ? explode('_', (string)$parsed['DB_DATABASE'], 2)[0] : '';
          flag('DB_USERNAME_AND_DATABASE_SHARE_PREFIX', $userPrefix !== '' && $dbPrefix !== '' && hash_equals($userPrefix, $dbPrefix));

          $log = file_get_contents('/tmp/prod-laravel.log') ?: '';
          preg_match_all("/Access denied for user '([^']+)'@'([^']+)' \\(using password: (YES|NO)\\)/", $log, $matches, PREG_SET_ORDER);
          flag('ACCESS_DENIED_PATTERN_FOUND', count($matches) > 0);
          flag('LOG_HAS_UNKNOWN_DATABASE', str_contains($log, 'Unknown database'));
          flag('LOG_HAS_DATABASE_PRIVILEGE_DENIED', preg_match('/Access denied for user .* to database /', $log) === 1);

          if ($matches) {
              $latest = $matches[array_key_last($matches)];
              flag('LATEST_REJECTED_USERNAME_MATCHES_DOTENV', isset($parsed['DB_USERNAME']) && hash_equals((string)$parsed['DB_USERNAME'], (string)$latest[1]));
              flag('LATEST_REJECTED_HOST_IS_LOCAL', in_array(strtolower((string)$latest[2]), ['localhost', '127.0.0.1'], true));
              flag('LATEST_REJECTED_ATTEMPT_USED_PASSWORD', strtoupper((string)$latest[3]) === 'YES');
          }
          PHP

      - name: Confirm affected public routes
        run: |
          set -euo pipefail
          for entry in 'HOME /' 'SERVICES /servicios' 'CATALOG /catalogo' 'CONTACT /contacto' 'PROCESS /proceso'; do
            key="${entry%% *}"
            path="${entry#* }"
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://eliasworks.uy${path}" || true)
            echo "${key}_HTTP_STATUS=${status}"
          done
