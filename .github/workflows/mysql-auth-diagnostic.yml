name: EliasWorks MySQL 1045 Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/mysql-auth-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect production DB configuration safely
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Fetch production configuration read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" \
            ftp://ftp.eliasworks.uy/public_html/.env \
            --output /tmp/prod.env

          if curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" \
            ftp://ftp.eliasworks.uy/public_html/bootstrap/cache/config.php \
            --output /tmp/prod-config-cache.php; then
            echo 'REMOTE_CONFIG_CACHE_PRESENT=true'
          else
            rm -f /tmp/prod-config-cache.php
            echo 'REMOTE_CONFIG_CACHE_PRESENT=false'
          fi

          if curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" \
            ftp://ftp.eliasworks.uy/public_html/storage/logs/laravel.log \
            --output /tmp/prod-laravel.log; then
            echo 'REMOTE_LARAVEL_LOG_PRESENT=true'
          else
            rm -f /tmp/prod-laravel.log
            echo 'REMOTE_LARAVEL_LOG_PRESENT=false'
          fi

      - name: Validate env shape without exposing values
        run: |
          python3 <<'PY'
          from pathlib import Path

          raw = Path('/tmp/prod.env').read_text(errors='replace').splitlines()
          values = {}
          counts = {}
          raw_values = {}

          for line in raw:
              stripped = line.strip()
              if not stripped or stripped.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              value = value.strip()
              counts[key] = counts.get(key, 0) + 1
              raw_values[key] = value
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {'\'', '"'}:
                  value = value[1:-1]
              values[key] = value

          def yes(name, condition):
              print(f'{name}={"true" if condition else "false"}')

          yes('ENV_PRESENT', bool(raw))
          yes('APP_ENV_IS_PRODUCTION', values.get('APP_ENV', '').lower() == 'production')
          yes('APP_DEBUG_IS_FALSE', values.get('APP_DEBUG', '').lower() in {'false', '0', 'off', 'no'})
          yes('DB_CONNECTION_IS_MYSQL', values.get('DB_CONNECTION', '').lower() == 'mysql')
          yes('DB_HOST_CONFIGURED', bool(values.get('DB_HOST', '')))
          yes('DB_HOST_IS_LOCAL', values.get('DB_HOST', '').lower() in {'localhost', '127.0.0.1'})
          yes('DB_PORT_CONFIGURED', bool(values.get('DB_PORT', '')))
          yes('DB_DATABASE_CONFIGURED', bool(values.get('DB_DATABASE', '')))
          yes('DB_USERNAME_CONFIGURED', bool(values.get('DB_USERNAME', '')))
          yes('DB_PASSWORD_CONFIGURED', bool(values.get('DB_PASSWORD', '')))
          yes('DB_CONNECTION_DUPLICATED', counts.get('DB_CONNECTION', 0) > 1)
          yes('DB_HOST_DUPLICATED', counts.get('DB_HOST', 0) > 1)
          yes('DB_DATABASE_DUPLICATED', counts.get('DB_DATABASE', 0) > 1)
          yes('DB_USERNAME_DUPLICATED', counts.get('DB_USERNAME', 0) > 1)
          yes('DB_PASSWORD_DUPLICATED', counts.get('DB_PASSWORD', 0) > 1)

          pw_raw = raw_values.get('DB_PASSWORD', '')
          quoted = len(pw_raw) >= 2 and pw_raw[0] == pw_raw[-1] and pw_raw[0] in {'\'', '"'}
          yes('DB_PASSWORD_QUOTED', quoted)
          yes('DB_PASSWORD_HAS_UNQUOTED_HASH_RISK', (not quoted) and '#' in pw_raw)
          yes('DB_PASSWORD_HAS_UNQUOTED_SPACE_RISK', (not quoted) and any(c.isspace() for c in pw_raw))
          yes('SESSION_DRIVER_IS_DATABASE', values.get('SESSION_DRIVER', '').lower() == 'database')
          yes('CACHE_STORE_IS_DATABASE', values.get('CACHE_STORE', '').lower() == 'database')
          yes('QUEUE_CONNECTION_IS_DATABASE', values.get('QUEUE_CONNECTION', '').lower() == 'database')
          PY

      - name: Compare cached DB config with env without exposing values
        run: |
          php <<'PHP'
          <?php
          function parseEnvFile(string $path): array {
              $result = [];
              foreach (file($path, FILE_IGNORE_NEW_LINES) ?: [] as $line) {
                  $trimmed = trim($line);
                  if ($trimmed === '' || str_starts_with($trimmed, '#') || !str_contains($line, '=')) {
                      continue;
                  }
                  [$key, $value] = explode('=', $line, 2);
                  $key = trim($key);
                  $value = trim($value);
                  if (strlen($value) >= 2 && (($value[0] === '"' && $value[-1] === '"') || ($value[0] === "'" && $value[-1] === "'"))) {
                      $value = substr($value, 1, -1);
                  }
                  $result[$key] = $value;
              }
              return $result;
          }

          function flag(string $name, bool $value): void {
              echo $name . '=' . ($value ? 'true' : 'false') . PHP_EOL;
          }

          $env = parseEnvFile('/tmp/prod.env');
          $cachePath = '/tmp/prod-config-cache.php';
          if (!file_exists($cachePath)) {
              flag('CACHED_CONFIG_COMPARISON_AVAILABLE', false);
              exit(0);
          }

          $config = require $cachePath;
          $mysql = $config['database']['connections']['mysql'] ?? [];
          flag('CACHED_CONFIG_COMPARISON_AVAILABLE', true);
          flag('CACHED_DB_DEFAULT_IS_MYSQL', ($config['database']['default'] ?? null) === 'mysql');
          flag('CACHED_DB_HOST_MATCHES_ENV', (string)($mysql['host'] ?? '') === (string)($env['DB_HOST'] ?? ''));
          flag('CACHED_DB_PORT_MATCHES_ENV', (string)($mysql['port'] ?? '') === (string)($env['DB_PORT'] ?? ''));
          flag('CACHED_DB_DATABASE_MATCHES_ENV', (string)($mysql['database'] ?? '') === (string)($env['DB_DATABASE'] ?? ''));
          flag('CACHED_DB_USERNAME_MATCHES_ENV', (string)($mysql['username'] ?? '') === (string)($env['DB_USERNAME'] ?? ''));
          flag('CACHED_DB_PASSWORD_MATCHES_ENV', (string)($mysql['password'] ?? '') === (string)($env['DB_PASSWORD'] ?? ''));
          PHP

      - name: Inspect Laravel log signature without exposing credentials
        run: |
          set -euo pipefail
          if [ -f /tmp/prod-laravel.log ]; then
            grep -Fq 'SQLSTATE[HY000] [1045]' /tmp/prod-laravel.log && echo 'LARAVEL_LOG_HAS_MYSQL_1045=true' || echo 'LARAVEL_LOG_HAS_MYSQL_1045=false'
            grep -Fq 'Access denied for user' /tmp/prod-laravel.log && echo 'LARAVEL_LOG_HAS_ACCESS_DENIED=true' || echo 'LARAVEL_LOG_HAS_ACCESS_DENIED=false'
          else
            echo 'LARAVEL_LOG_HAS_MYSQL_1045=unknown'
            echo 'LARAVEL_LOG_HAS_ACCESS_DENIED=unknown'
          fi

      - name: Probe public routes
        run: |
          set -euo pipefail
          probe() {
            local key="$1"
            local path="$2"
            local file="/tmp/${key}.html"
            local status
            status=$(curl --silent --show-error --location --output "$file" --write-out '%{http_code}' "https://eliasworks.uy${path}" || true)
            echo "${key}_HTTP_STATUS=${status}"
            grep -Fq 'SQLSTATE[HY000] [1045]' "$file" && echo "${key}_BODY_HAS_MYSQL_1045=true" || echo "${key}_BODY_HAS_MYSQL_1045=false"
          }

          probe HOME /
          probe SERVICES /servicios
          probe CATALOG /catalogo
          probe CONTACT /contacto
          probe PROCESS /proceso
