name: EliasWorks FTP Root Diagnostic

# Branch-only probe: read-only checks to identify the live document root.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect live EliasWorks safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare existing static files read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          compare_file() {
            local label="$1"
            local http_url="$2"
            local ftp_url="$3"
            local http_file="/tmp/${label}-http"
            local ftp_file="/tmp/${label}-ftp"

            local http_status
            http_status=$(curl --silent --show-error --location --output "$http_file" --write-out '%{http_code}' "$http_url")
            echo "${label}_HTTP_STATUS=${http_status}"

            if curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" "$ftp_url" --output "$ftp_file"; then
              echo "${label}_FTP_EXISTS=true"
            else
              echo "${label}_FTP_EXISTS=false"
              return 0
            fi

            if [ "$http_status" = "200" ]; then
              echo "${label}_HTTP_BYTES=$(wc -c < "$http_file")"
              echo "${label}_FTP_BYTES=$(wc -c < "$ftp_file")"
              echo "${label}_HTTP_SHA256=$(sha256sum "$http_file" | cut -d' ' -f1)"
              echo "${label}_FTP_SHA256=$(sha256sum "$ftp_file" | cut -d' ' -f1)"
              if cmp -s "$http_file" "$ftp_file"; then
                echo "${label}_MATCH=true"
              else
                echo "${label}_MATCH=false"
              fi
            fi
          }

          echo '=== PUBLIC_HTML/PUBLIC STATIC PROBES ==='
          compare_file ROBOTS https://eliasworks.uy/robots.txt ftp://ftp.eliasworks.uy/public_html/public/robots.txt
          compare_file SITEMAP https://eliasworks.uy/sitemap.xml ftp://ftp.eliasworks.uy/public_html/public/sitemap.xml
          compare_file FAVICON https://eliasworks.uy/favicon.ico ftp://ftp.eliasworks.uy/public_html/public/favicon.ico

          echo '=== ELIASWORKS.UY DIRECTORY STATIC PROBE ==='
          compare_file PRUEBA https://eliasworks.uy/prueba.html ftp://ftp.eliasworks.uy/eliasworks.uy/prueba.html

      - name: Verify current Laravel source is present in deployment target
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/resources/views/livewire/pages/home-page.blade.php --output /tmp/home.blade.php
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/home.blade.php && echo 'FTP_PUBLIC_HTML_CURRENT_HOME=true' || echo 'FTP_PUBLIC_HTML_CURRENT_HOME=false'
          grep -Fq 'Insurance Claims Legacy Modernization' /tmp/home.blade.php && echo 'FTP_PUBLIC_HTML_CURRENT_INSURANCECLAIMS=true' || echo 'FTP_PUBLIC_HTML_CURRENT_INSURANCECLAIMS=false'
