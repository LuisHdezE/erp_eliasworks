name: EliasWorks FTP Root Diagnostic

# Branch-only probe: read-only checks to identify what eliasworks.uy actually serves.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect live EliasWorks safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect public DNS and HTTP signals read-only
        run: |
          set -euo pipefail
          echo '=== DNS ==='
          echo "A_RECORDS=$(getent ahostsv4 eliasworks.uy | awk '{print $1}' | sort -u | paste -sd, -)"

          curl --silent --show-error --fail --location --dump-header /tmp/live-headers.txt https://eliasworks.uy/ --output /tmp/live-home.html

          echo '=== SAFE HTTP HEADERS ==='
          grep -Ei '^(HTTP/|server:|via:|x-powered-by:|x-cache:|cf-|content-type:|content-length:|etag:|last-modified:|location:)' /tmp/live-headers.txt || true

          echo '=== SAFE DOCUMENT SIGNALS ==='
          TITLE=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/live-home.html').read_text(errors='ignore')
          match = re.search(r'<title[^>]*>(.*?)</title>', text, flags=re.I|re.S)
          print(re.sub(r'\s+', ' ', match.group(1)).strip() if match else 'NONE')
          PY
          )
          H1=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/live-home.html').read_text(errors='ignore')
          match = re.search(r'<h1[^>]*>(.*?)</h1>', text, flags=re.I|re.S)
          if not match:
              print('NONE')
          else:
              value = re.sub(r'<[^>]+>', ' ', match.group(1))
              print(re.sub(r'\s+', ' ', value).strip()[:240])
          PY
          )
          echo "TITLE=${TITLE}"
          echo "H1=${H1}"
          echo "LIVE_BYTES=$(wc -c < /tmp/live-home.html)"
          echo "LIVE_SHA256=$(sha256sum /tmp/live-home.html | cut -d' ' -f1)"

      - name: Compare origin candidates read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location https://eliasworks.uy/ --output /tmp/live-home.html
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/eliasworks.uy/index.html --output /tmp/ftp-static-home.html
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/resources/views/livewire/pages/home-page.blade.php --output /tmp/ftp-laravel-home.blade.php

          echo '=== CANDIDATE SIGNALS ==='
          cmp -s /tmp/live-home.html /tmp/ftp-static-home.html && echo 'LIVE_EQUALS_STATIC_INDEX=true' || echo 'LIVE_EQUALS_STATIC_INDEX=false'
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/live-home.html && echo 'LIVE_HAS_CURRENT_LARAVEL_COPY=true' || echo 'LIVE_HAS_CURRENT_LARAVEL_COPY=false'
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/ftp-laravel-home.blade.php && echo 'FTP_PUBLIC_HTML_HAS_CURRENT_LARAVEL_COPY=true' || echo 'FTP_PUBLIC_HTML_HAS_CURRENT_LARAVEL_COPY=false'

      - name: Dry-run FTP sync against account root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.eliasworks.uy
          username: luis@eliasworks.uy
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ./
          dry-run: true
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            phpunit.xml
            README.md
            composer.lock
            package.json
            package-lock.json
            vite.config.js
            deploy.md
            cookies.txt
