name: EliasWorks FTP Root Diagnostic

# Branch-only probe: read-only checks to identify what eliasworks.uy actually serves.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect live EliasWorks safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify live Laravel portfolio signals read-only
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location https://eliasworks.uy/ --output /tmp/live-home.html
          curl --silent --show-error --fail --location https://eliasworks.uy/proyectos --output /tmp/live-projects.html

          echo '=== LIVE HOME SIGNALS ==='
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/live-home.html && echo 'HOME_CURRENT_POSITIONING=true' || echo 'HOME_CURRENT_POSITIONING=false'
          grep -Fq 'Insurance Claims Legacy Modernization' /tmp/live-home.html && echo 'HOME_INSURANCECLAIMS=true' || echo 'HOME_INSURANCECLAIMS=false'
          grep -Fq 'R3 full-product release · v0.3.0' /tmp/live-home.html && echo 'HOME_R3_RELEASE=true' || echo 'HOME_R3_RELEASE=false'

          echo '=== LIVE PROJECTS SIGNALS ==='
          grep -Fq 'Proyectos seleccionados' /tmp/live-projects.html && echo 'PROJECTS_CURRENT_HEADING=true' || echo 'PROJECTS_CURRENT_HEADING=false'
          grep -Fq '22 superficies web productizadas' /tmp/live-projects.html && echo 'PROJECTS_R3_EVIDENCE=true' || echo 'PROJECTS_R3_EVIDENCE=false'
          grep -Fq 'eFactura' /tmp/live-projects.html && echo 'PROJECTS_EFACTURA=true' || echo 'PROJECTS_EFACTURA=false'
          grep -Fq 'ZoFloridane' /tmp/live-projects.html && echo 'PROJECTS_ZOFLORIDANE=true' || echo 'PROJECTS_ZOFLORIDANE=false'

      - name: Compare live homepage with static FTP candidate read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location https://eliasworks.uy/ --output /tmp/live-home.html
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/eliasworks.uy/index.html --output /tmp/ftp-home.html
          echo "LIVE_BYTES=$(wc -c < /tmp/live-home.html)"
          echo "FTP_STATIC_BYTES=$(wc -c < /tmp/ftp-home.html)"
          if cmp -s /tmp/live-home.html /tmp/ftp-home.html; then
            echo 'LIVE_MATCHES_STATIC_ELIASWORKS_ROOT=true'
          else
            echo 'LIVE_MATCHES_STATIC_ELIASWORKS_ROOT=false'
          fi

      - name: Dry-run FTP sync against account root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.eliasworks.uy
          username: luis@eliasworks.uy
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ./
          dry-run: true
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            phpunit.xml
            README.md
            composer.lock
            package.json
            package-lock.json
            vite.config.js
            deploy.md
            cookies.txt
