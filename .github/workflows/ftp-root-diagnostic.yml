name: EliasWorks FTP Root Diagnostic

# Post-PR7 production verification. Read-only against the hosting target.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect live EliasWorks safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fingerprint divergent production front controller read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" \
            ftp://ftp.eliasworks.uy/public_html/public/index.php \
            --output /tmp/remote-index.php

          echo "LOCAL_INDEX_BYTES=$(wc -c < public/index.php)"
          echo "REMOTE_INDEX_BYTES=$(wc -c < /tmp/remote-index.php)"
          echo "LOCAL_INDEX_SHA256=$(sha256sum public/index.php | cut -d' ' -f1)"
          echo "REMOTE_INDEX_SHA256=$(sha256sum /tmp/remote-index.php | cut -d' ' -f1)"

          grep -Fq "require_once __DIR__.'/../vendor/autoload.php'" /tmp/remote-index.php && echo 'REMOTE_HAS_LARAVEL_AUTOLOAD=true' || echo 'REMOTE_HAS_LARAVEL_AUTOLOAD=false'
          grep -Fq "require_once __DIR__.'/../bootstrap/app.php'" /tmp/remote-index.php && echo 'REMOTE_HAS_LARAVEL_BOOTSTRAP=true' || echo 'REMOTE_HAS_LARAVEL_BOOTSTRAP=false'
          grep -Fq 'handleRequest' /tmp/remote-index.php && echo 'REMOTE_HAS_HANDLE_REQUEST=true' || echo 'REMOTE_HAS_HANDLE_REQUEST=false'
          grep -Fqi '<!DOCTYPE html' /tmp/remote-index.php && echo 'REMOTE_HAS_HTML_DOCUMENT=true' || echo 'REMOTE_HAS_HTML_DOCUMENT=false'
          grep -Fq 'Elias Works | Engineering Solutions & Software Development' /tmp/remote-index.php && echo 'REMOTE_HAS_OLD_TITLE=true' || echo 'REMOTE_HAS_OLD_TITLE=false'
          grep -Fq 'Ingeniería & Software que genera resultados' /tmp/remote-index.php && echo 'REMOTE_HAS_OLD_HERO=true' || echo 'REMOTE_HAS_OLD_HERO=false'
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/remote-index.php && echo 'REMOTE_HAS_CURRENT_HERO=true' || echo 'REMOTE_HAS_CURRENT_HERO=false'

      - name: Inspect FTP deploy state read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" \
            ftp://ftp.eliasworks.uy/public_html/.ftp-deploy-sync-state.json \
            --output /tmp/ftp-state.json; then
            echo 'FTP_STATE_EXISTS=true'
            echo "FTP_STATE_BYTES=$(wc -c < /tmp/ftp-state.json)"
            grep -Fq 'public/index.php' /tmp/ftp-state.json && echo 'FTP_STATE_TRACKS_PUBLIC_INDEX=true' || echo 'FTP_STATE_TRACKS_PUBLIC_INDEX=false'
          else
            echo 'FTP_STATE_EXISTS=false'
          fi

      - name: Confirm public response remains stale
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location https://eliasworks.uy/ --output /tmp/live-home.html
          echo "LIVE_BYTES=$(wc -c < /tmp/live-home.html)"
          echo "LIVE_SHA256=$(sha256sum /tmp/live-home.html | cut -d' ' -f1)"
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/live-home.html && echo 'LIVE_HAS_CURRENT_HOME=true' || echo 'LIVE_HAS_CURRENT_HOME=false'
          grep -Fq 'Elias Works | Engineering Solutions & Software Development' /tmp/live-home.html && echo 'LIVE_HAS_OLD_TITLE=true' || echo 'LIVE_HAS_OLD_TITLE=false'
