name: EliasWorks FTP Root Diagnostic

# Branch-only probe: read-only checks to identify stale Laravel runtime artifacts.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect live EliasWorks safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify live root and deployed source read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail --location https://eliasworks.uy/ --output /tmp/live-home.html
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/resources/views/livewire/pages/home-page.blade.php --output /tmp/source-home.blade.php
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/routes/web.php --output /tmp/routes-web.php

          grep -Fq 'Ingeniería & Software que genera resultados' /tmp/live-home.html && echo 'LIVE_OLD_HERO=true' || echo 'LIVE_OLD_HERO=false'
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/source-home.blade.php && echo 'DEPLOYED_SOURCE_CURRENT_HOME=true' || echo 'DEPLOYED_SOURCE_CURRENT_HOME=false'
          grep -Fq "Route::get('/', HomePage::class)" /tmp/routes-web.php && echo 'DEPLOYED_ROUTE_CURRENT_HOME=true' || echo 'DEPLOYED_ROUTE_CURRENT_HOME=false'

      - name: Inspect compiled Blade views read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail --list-only --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/storage/framework/views/ > /tmp/views-list.txt
          TOTAL=$(grep -Ec '\.php$' /tmp/views-list.txt || true)
          echo "COMPILED_VIEW_FILES=${TOTAL}"

          OLD_HERO_MATCHES=0
          OLD_TITLE_MATCHES=0
          CURRENT_HOME_MATCHES=0
          SCANNED=0

          while IFS= read -r file; do
            case "$file" in
              *.php)
                SCANNED=$((SCANNED + 1))
                target="/tmp/view-${SCANNED}.php"
                if curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" "ftp://ftp.eliasworks.uy/public_html/storage/framework/views/${file}" --output "$target"; then
                  grep -Fq 'Ingeniería & Software que genera resultados' "$target" && OLD_HERO_MATCHES=$((OLD_HERO_MATCHES + 1)) || true
                  grep -Fq 'Elias Works | Engineering Solutions & Software Development' "$target" && OLD_TITLE_MATCHES=$((OLD_TITLE_MATCHES + 1)) || true
                  grep -Fq 'Construyo y modernizo software de negocio' "$target" && CURRENT_HOME_MATCHES=$((CURRENT_HOME_MATCHES + 1)) || true
                fi
                ;;
            esac
          done < /tmp/views-list.txt

          echo "COMPILED_VIEWS_SCANNED=${SCANNED}"
          echo "COMPILED_OLD_HERO_MATCHES=${OLD_HERO_MATCHES}"
          echo "COMPILED_OLD_TITLE_MATCHES=${OLD_TITLE_MATCHES}"
          echo "COMPILED_CURRENT_HOME_MATCHES=${CURRENT_HOME_MATCHES}"

      - name: Inspect Laravel cache inventory read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          echo '=== BOOTSTRAP CACHE FILE NAMES ==='
          curl --silent --show-error --fail --list-only --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/bootstrap/cache/ \
            | sed '/^$/d' \
            | sed -E 's/[^A-Za-z0-9._-]/_/g' \
            | sort

          echo '=== VIEW CACHE COUNT ONLY ==='
          curl --silent --show-error --fail --list-only --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/storage/framework/views/ \
            | grep -Ec '\.php$' || true
