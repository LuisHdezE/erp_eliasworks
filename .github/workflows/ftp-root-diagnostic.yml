name: EliasWorks FTP Root Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect live EliasWorks safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare deployed runtime files byte-for-byte
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          compare_runtime_file() {
            local label="$1"
            local local_path="$2"
            local remote_path="$3"
            local remote_file="/tmp/${label}.remote"

            echo "=== ${label} ==="
            if [ ! -f "$local_path" ]; then
              echo "LOCAL_EXISTS=false"
              return 0
            fi

            echo "LOCAL_EXISTS=true"
            if curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" "ftp://ftp.eliasworks.uy/public_html/${remote_path}" --output "$remote_file"; then
              echo "REMOTE_EXISTS=true"
            else
              echo "REMOTE_EXISTS=false"
              return 0
            fi

            echo "LOCAL_BYTES=$(wc -c < "$local_path")"
            echo "REMOTE_BYTES=$(wc -c < "$remote_file")"
            echo "LOCAL_SHA256=$(sha256sum "$local_path" | cut -d' ' -f1)"
            echo "REMOTE_SHA256=$(sha256sum "$remote_file" | cut -d' ' -f1)"

            if cmp -s "$local_path" "$remote_file"; then
              echo "MATCH=true"
            else
              echo "MATCH=false"
            fi
          }

          compare_runtime_file PUBLIC_INDEX public/index.php public/index.php
          compare_runtime_file BOOTSTRAP_APP bootstrap/app.php bootstrap/app.php
          compare_runtime_file HOME_PAGE_CLASS app/Presentation/Livewire/Pages/HomePage.php app/Presentation/Livewire/Pages/HomePage.php
          compare_runtime_file WEB_ROUTES routes/web.php routes/web.php
          compare_runtime_file PUBLIC_HTACCESS public/.htaccess public/.htaccess
          compare_runtime_file HOME_BLADE resources/views/livewire/pages/home-page.blade.php resources/views/livewire/pages/home-page.blade.php

      - name: Confirm live response remains distinct from current source
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location https://eliasworks.uy/ --output /tmp/live-home.html
          echo "LIVE_BYTES=$(wc -c < /tmp/live-home.html)"
          echo "LIVE_SHA256=$(sha256sum /tmp/live-home.html | cut -d' ' -f1)"
          grep -Fq 'Construyo y modernizo software de negocio' /tmp/live-home.html && echo 'LIVE_HAS_CURRENT_HOME=true' || echo 'LIVE_HAS_CURRENT_HOME=false'
