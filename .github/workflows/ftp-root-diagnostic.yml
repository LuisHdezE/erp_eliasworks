name: EliasWorks FTP Root Diagnostic

# Branch-only probe: read-only checks to identify the document root actually serving eliasworks.uy.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect FTP root safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare live homepage with FTP candidate read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location https://eliasworks.uy/ --output /tmp/live-home.html
          curl --silent --show-error --fail --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/eliasworks.uy/index.html --output /tmp/ftp-home.html

          echo '=== SAFE HOMEPAGE COMPARISON ==='
          echo "LIVE_BYTES=$(wc -c < /tmp/live-home.html)"
          echo "FTP_BYTES=$(wc -c < /tmp/ftp-home.html)"
          echo "LIVE_SHA256=$(sha256sum /tmp/live-home.html | cut -d' ' -f1)"
          echo "FTP_SHA256=$(sha256sum /tmp/ftp-home.html | cut -d' ' -f1)"

          if cmp -s /tmp/live-home.html /tmp/ftp-home.html; then
            echo 'LIVE_MATCHES_FTP_ELIASWORKS_ROOT=true'
          else
            echo 'LIVE_MATCHES_FTP_ELIASWORKS_ROOT=false'
          fi

          echo '=== SAFE TEXT SIGNALS ==='
          if grep -Fq 'Ingeniería & Software que genera resultados' /tmp/live-home.html; then
            echo 'LIVE_CONTAINS_OLD_HERO=true'
          else
            echo 'LIVE_CONTAINS_OLD_HERO=false'
          fi
          if grep -Fq 'Ingeniería & Software que genera resultados' /tmp/ftp-home.html; then
            echo 'FTP_CANDIDATE_CONTAINS_OLD_HERO=true'
          else
            echo 'FTP_CANDIDATE_CONTAINS_OLD_HERO=false'
          fi

      - name: List candidate web roots read-only
        env:
          FTP_USER: luis@eliasworks.uy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo '=== FTP /public_html ==='
          curl --silent --show-error --fail --list-only --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/public_html/
          echo '=== FTP /eliasworks.uy ==='
          curl --silent --show-error --fail --list-only --user "${FTP_USER}:${FTP_PASSWORD}" ftp://ftp.eliasworks.uy/eliasworks.uy/

      - name: Dry-run FTP sync against account root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.eliasworks.uy
          username: luis@eliasworks.uy
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ./
          dry-run: true
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            phpunit.xml
            README.md
            composer.lock
            package.json
            package-lock.json
            vite.config.js
            deploy.md
            cookies.txt
