name: EliasWorks FTP Root Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ftp-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-root-diagnostic:
    name: Inspect live EliasWorks safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe public cache behavior read-only
        run: |
          set -euo pipefail

          for variant in normal bust nocache direct_public; do
            case "$variant" in
              normal)
                url='https://eliasworks.uy/'
                curl --silent --show-error --fail --location --dump-header "/tmp/${variant}.headers" "$url" --output "/tmp/${variant}.html"
                ;;
              bust)
                url="https://eliasworks.uy/?ew_diag=${GITHUB_SHA}"
                curl --silent --show-error --fail --location --dump-header "/tmp/${variant}.headers" "$url" --output "/tmp/${variant}.html"
                ;;
              nocache)
                url="https://eliasworks.uy/?ew_nocache=${GITHUB_RUN_ID}"
                curl --silent --show-error --fail --location -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' --dump-header "/tmp/${variant}.headers" "$url" --output "/tmp/${variant}.html"
                ;;
              direct_public)
                url="https://eliasworks.uy/public/?ew_public=${GITHUB_SHA}"
                curl --silent --show-error --fail --location -H 'Cache-Control: no-cache' --dump-header "/tmp/${variant}.headers" "$url" --output "/tmp/${variant}.html"
                ;;
            esac

            echo "=== ${variant} ==="
            echo "BYTES=$(wc -c < "/tmp/${variant}.html")"
            echo "SHA256=$(sha256sum "/tmp/${variant}.html" | cut -d' ' -f1)"
            grep -Eio '<h1[^>]*>[^<]*' "/tmp/${variant}.html" | head -1 | sed -E 's/<h1[^>]*>//' | sed 's/&amp;/\&/g' | sed 's/^/H1=/' || true
            grep -Fq 'Construyo y modernizo software de negocio' "/tmp/${variant}.html" && echo 'CURRENT_HOME=true' || echo 'CURRENT_HOME=false'
            grep -Fq 'Ingeniería &amp; Software que genera resultados' "/tmp/${variant}.html" && echo 'OLD_HOME=true' || echo 'OLD_HOME=false'
            grep -Ei '^(HTTP/|server:|cache-control:|age:|via:|x-cache:|x-litespeed-cache:|x-litespeed-tag:|etag:|last-modified:)' "/tmp/${variant}.headers" || true
          done
