name: EliasWorks Visual Review V3.2

on:
  push:
    branches:
      - portfolio/first-viewport-v3-2
  pull_request:
    branches:
      - main

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/eliasworks.log 2>&1 &
      - run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:8000', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'home-desktop-1440-viewport.png' });
            await page.screenshot({ path: 'home-desktop-1440-full.png', fullPage: true });
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:8000', { waitUntil: 'networkidle' });
            await mobile.screenshot({ path: 'home-mobile-390-full.png', fullPage: true });
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: eliasworks-v3-2-visual-review
          path: |
            home-desktop-1440-viewport.png
            home-desktop-1440-full.png
            home-mobile-390-full.png
