name: EliasWorks Visual Review

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Render Home screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, gd
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          printf '\nDB_CONNECTION=sqlite\nDB_DATABASE=%s/database/database.sqlite\n' "$GITHUB_WORKSPACE" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Laravel
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/eliasworks-laravel.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eliasworks-laravel.log
          exit 1

      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p visual-review
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              { name: 'home-desktop-1440', width: 1440, height: 1000 },
              { name: 'home-mobile-390', width: 390, height: 844 },
            ];

            for (const target of targets) {
              const page = await browser.newPage({ viewport: { width: target.width, height: target.height }, deviceScaleFactor: 1 });
              await page.goto('http://127.0.0.1:8000/', { waitUntil: 'networkidle' });
              await page.screenshot({ path: `visual-review/${target.name}-viewport.png`, fullPage: false });
              await page.screenshot({ path: `visual-review/${target.name}-full.png`, fullPage: true });
              await page.close();
            }

            await browser.close();
          })();
          NODE

      - name: Upload visual review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eliasworks-home-v2-visual-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 7
