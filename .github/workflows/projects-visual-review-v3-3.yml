name: EliasWorks Projects Visual Review V3.3

on:
  push:
    branches:
      - portfolio/secondary-pages-compact-v3-3
    paths:
      - '.github/workflows/projects-visual-review-v3-3.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/projects-visual-review-v3-3.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/eliasworks.log 2>&1 &
      - name: Capture projects page
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await desktop.goto('http://127.0.0.1:8000/proyectos', { waitUntil: 'networkidle' });
            await desktop.screenshot({ path: 'projects-v3-3-desktop-viewport.png' });
            await desktop.screenshot({ path: 'projects-v3-3-desktop-full.png', fullPage: true });
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:8000/proyectos', { waitUntil: 'networkidle' });
            await mobile.screenshot({ path: 'projects-v3-3-mobile-full.png', fullPage: true });
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: eliasworks-projects-visual-review-v3-3
          path: 'projects-v3-3-*.png'
